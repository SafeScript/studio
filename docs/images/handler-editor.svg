<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="795" viewBox="0 0 1280 795" role="img" aria-labelledby="title desc">
<title id="title">Handler selectors, code controls and paused locals</title>
<desc id="desc">The Handlers pane shows object and onClick selectors, stepping, Apply edits and Continue controls. A SafeScript pricing example is paused before its calculation, with seats and price shown in Locals and a watch-expression input. This is an annotated illustration rather than a screenshot.</desc>
<rect x="0" y="0" width="1280" height="795" rx="20" fill="#0d1222" stroke="none" stroke-width="1"/>
<text x="40" y="45" fill="#61dfbc" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">SAFE STUDIO / UX GUIDE</text><text x="40" y="91" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">A button’s behavior has a place in the workspace</text><text x="40" y="123" fill="#aebbd6" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Choose the object and event, then write the handler. During a pause, inspect its local values.</text><rect x="40" y="161" width="1200" height="400" rx="12" fill="#171d34" stroke="#354161" stroke-width="1"/><text x="56" y="199" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">Handlers</text><rect x="56" y="223" width="236" height="32" rx="6" fill="#222b49" stroke="none" stroke-width="1"/><text x="66" y="245" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Hero_Action ▾</text><rect x="304" y="223" width="157" height="32" rx="6" fill="#222b49" stroke="none" stroke-width="1"/><text x="314" y="245" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">onClick ▾</text><rect x="479" y="223" width="80" height="32" rx="6" fill="#222b49" stroke="none" stroke-width="1"/><text x="489" y="245" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Step</text><rect x="570" y="223" width="77" height="32" rx="6" fill="#222b49" stroke="none" stroke-width="1"/><text x="580" y="245" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Into</text><rect x="658" y="223" width="77" height="32" rx="6" fill="#222b49" stroke="none" stroke-width="1"/><text x="668" y="245" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Out</text><rect x="747" y="223" width="144" height="32" rx="6" fill="#222b49" stroke="none" stroke-width="1"/><text x="757" y="245" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Apply edits</text><rect x="903" y="223" width="122" height="32" rx="6" fill="#222b49" stroke="none" stroke-width="1"/><text x="913" y="245" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Continue</text><rect x="55" y="274" width="835" height="268" rx="6" fill="#0d1222" stroke="none" stroke-width="1"/><rect x="56" y="366" width="834" height="45" rx="0" fill="#363149" stroke="none" stroke-width="1"/><text x="78" y="312" fill="#93bcff" font-family="Consolas, monospace" font-size="22" font-weight="400">1  var seats = 4;</text><text x="78" y="350" fill="#93bcff" font-family="Consolas, monospace" font-size="22" font-weight="400">2  var price = 25;</text><text x="78" y="394" fill="#ffd18a" font-family="Consolas, monospace" font-size="22" font-weight="400">3  var total = seats * price;</text><text x="78" y="437" fill="#eef2ff" font-family="Consolas, monospace" font-size="22" font-weight="400">4  context.block.textContent</text><text x="78" y="474" fill="#61dfbc" font-family="Consolas, monospace" font-size="22" font-weight="400">5    = &#x27;Total: $&#x27; + total;</text><circle cx="69" cy="386" r="5" fill="#0d1222" stroke="#ffd18a" stroke-width="3"/><text x="78" y="522" fill="#aebbd6" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Paused at a generated SafeScript checkpoint</text><rect x="906" y="274" width="316" height="268" rx="6" fill="#222b49" stroke="none" stroke-width="1"/><text x="925" y="307" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Locals</text><path d="M923 322 L1207 322" stroke="#354161" stroke-width="2" fill="none"/><text x="926" y="358" fill="#aebbd6" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400">seats</text><text x="1118" y="358" fill="#61dfbc" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">4</text><text x="926" y="400" fill="#aebbd6" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400">price</text><text x="1118" y="400" fill="#61dfbc" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">25</text><text x="926" y="445" fill="#aebbd6" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Watch expressions</text><rect x="923" y="460" width="280" height="38" rx="5" fill="#0d1222" stroke="none" stroke-width="1"/><text x="935" y="485" fill="#aebbd6" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">+ Add watch expression</text><rect x="40" y="574" width="125" height="32" rx="6" fill="#8975ff" stroke="none" stroke-width="1"/><text x="50" y="596" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Handlers</text><rect x="173" y="574" width="115" height="32" rx="6" fill="#222b49" stroke="none" stroke-width="1"/><text x="183" y="596" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Timeline</text><rect x="40" y="625" width="1200" height="140" rx="12" fill="#171d34" stroke="none" stroke-width="1"/><text x="62" y="660" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">The familiar “select a control → edit its event” loop.</text><text x="62" y="696" fill="#aebbd6" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400">Double-click a block, use its Code action, or open Handlers and choose an object / event.</text><text x="62" y="733" fill="#61dfbc" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400">Switch to Test for a real event; inspect a pause before applying a supported edit and continuing.</text>
</svg>
