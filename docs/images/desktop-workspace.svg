-width="1"/><text x="60.0" y="630" fill="#aebbd6" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Hero_Action</text><rect x="208.0" y="610" width="152.0" height="29" rx="5" fill="#8975ff" stroke="none" stroke-width="1"/><text x="215.0" y="630" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">onClick</text><text x="55" y="670" fill="#93bcff" font-family="Consolas, monospace" font-size="19" font-weight="400">1  context.block.textContent</text><text x="55" y="701" fill="#61dfbc" font-family="Consolas, monospace" font-size="19" font-weight="400">2    = &quot;Welcome aboard!&quot;;</text><text x="55" y="756" fill="#aebbd6" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Object + event → code for that interaction</text><rect x="638" y="597" width="602" height="186" rx="9" fill="#171d34" stroke="#354161" stroke-width="1"/><text x="658" y="627" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Timeline</text><text x="1052" y="627" fill="#aebbd6" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Undo   Redo</text><circle cx="666" cy="658" r="5" fill="#0d1222" stroke="#8975ff" stroke-width="3"/><text x="684" y="664" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Apply template</text><circle cx="666" cy="701" r="5" fill="#0d1222" stroke="#8975ff" stroke-width="3"/><text x="684" y="707" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Edit heading</text><circle cx="666" cy="744" r="5" fill="#0d1222" stroke="#8975ff" stroke-width="3"/><text x="684" y="750" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Change theme</text><rect x="40" y="798" width="125" height="32" rx="6" fill="#8975ff" stroke="none" stroke-width="1"/><text x="50" y="820" fill="#eef2ff" font-family="Arial, Helvetica, sans-