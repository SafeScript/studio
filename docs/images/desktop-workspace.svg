<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="940" viewBox="0 0 1280 940" role="img" aria-labelledby="title desc">
<title id="title">Desktop panes and their everyday jobs</title>
<desc id="desc">A realistic annotated desktop layout shows project controls above a selected canvas block, a right inspector with Properties, Outline, Assets and Add tabs, and the lower Handlers and Timeline dock. Numbered explanations show where to select, customize, code and inspect history.</desc>
