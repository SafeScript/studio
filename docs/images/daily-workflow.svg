<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">The everyday choose, customize, test and save workflow</title>
<desc id="desc">Three simplified interface states show a template gallery, a selected heading with inspector tabs, and Test mode with a calculator button. The final instruction explains local saves, save points, and portable project export.</desc>
<rect x="0" y="0" width="1280" height="720" rx="20" fill="#0d1222" stroke="none" stroke-width="1"/>
<text x="40" y="45" fill="#61dfbc" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">SAFE STUDIO / UX GUIDE</text><text x="40" y="91" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">An everyday loop: choose, customize, try</text><text x="40" y="123" fill="#aebbd6" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">One small page change, from a starting point to an interaction you can test.</text><rect x="40" y="160" width="372" height="392" rx="14" fill="#171d34" stroke="#354161" stroke-width="1"/><circle cx="65" cy="190" r="15" fill="#61dfbc"/><text x="60" y="196" fill="#0d1222" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">1</text><text x="89" y="197" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">Start from a template</text><rect x="454" y="160" width="372" height="392" rx="14" fill="#171d34" stroke="#354161" stroke-width="1"/><circle cx="479" cy="190" r="15" fill="#61dfbc"/><text x="474" y="196" fill="#0d1222" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">2</text><text x="503" y="197" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">Select and customize</text><rect x="868" y="160" width="372" height="392" rx="14" fill="#171d34" stroke="#354161" stroke-width="1"/><circle cx="893" cy="190" r="15" fill="#61dfbc"/><text x="888" y="196" fill="#0d1222" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">3</text><text x="917" y="197" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">Switch to Test</text><rect x="57" y="222" width="338" height="207" rx="8" fill="#222b49" stroke="none" stroke-width="1"/><text x="72" y="251" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Templates</text><rect x="71" y="265" width="309" height="30" rx="4" fill="#0d1222" stroke="none" stroke-width="1"/><text x="80" y="287" fill="#aebbd6" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Search templates…</text><rect x="71" y="309" width="150" height="101" rx="5" fill="#171d34" stroke="#8975ff" stroke-width="1"/><rect x="81" y="318" width="130" height="31" rx="4" fill="#3a3566" stroke="none" stroke-width="1"/><rect x="81" y="356" width="62" height="16" rx="2" fill="#39445e" stroke="none" stroke-width="1"/><rect x="149" y="356" width="62" height="16" rx="2" fill="#39445e" stroke="none" stroke-width="1"/><text x="81" y="395" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400">Landing page</text><rect x="230" y="309" width="150" height="101" rx="5" fill="#171d34" stroke="#354161" stroke-width="1"/><rect x="240" y="318" width="130" height="31" rx="4" fill="#3a3566" stroke="none" stroke-width="1"/><rect x="240" y="356" width="62" height="16" rx="2" fill="#39445e" stroke="none" stroke-width="1"/><rect x="308" y="356" width="62" height="16" rx="2" fill="#39445e" stroke="none" stroke-width="1"/><text x="240" y="395" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400">Portfolio</text><text x="60" y="465" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Pick a starting page.</text><text x="60" y="496" fill="#aebbd6" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Or import a project / add a layout.</text><rect x="470" y="222" width="340" height="124" rx="7" fill="#222b49" stroke="none" stroke-width="1"/><rect x="486" y="245" width="306" height="56" rx="4" fill="#332b56" stroke="#8975ff" stroke-width="2"/><text x="498" y="280" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Your headline goes here</text><rect x="470.0" y="364" width="82.0" height="29" rx="5" fill="#8975ff" stroke="none" stroke-width="1"/><text x="477.0" y="384" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Properties</text><rect x="555.0" y="364" width="82.0" height="29" rx="5" fill="#222b49" stroke="none" stroke-width="1"/><text x="562.0" y="384" fill="#aebbd6" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400">Outline</text><rect x="640.0" y="364" width="82.0" height="29" rx="5" fill="#222b49" stroke="none" stroke-width="1"/><text x="647.0" y="384" fill="#aebbd6" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400">Assets</text><rect x="725.0" y="364" width="82.0" height="29" rx="5" fill="#222b49" stroke="none" stroke-width="1"/><text x="732.0" y="384" fill="#aebbd6" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400">Add</text><text x="481" y="419" fill="#aebbd6" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Edit text · spacing · theme · image</text><text x="474" y="465" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Select on canvas or in Outline.</text><text x="474" y="496" fill="#aebbd6" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Use Add and Assets as needed.</text><rect x="889" y="225" width="63" height="32" rx="6" fill="#222b49" stroke="none" stroke-width="1"/><text x="899" y="247" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Edit</text><rect x="961" y="225" width="60" height="32" rx="6" fill="#8975ff" stroke="none" stroke-width="1"/><text x="971" y="247" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Test</text><rect x="889" y="274" width="328" height="154" rx="7" fill="#222b49" stroke="none" stroke-width="1"/><text x="905" y="309" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">Try the button</text><rect x="905" y="333" width="174" height="32" rx="6" fill="#8975ff" stroke="none" stroke-width="1"/><text x="915" y="355" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Calculate quote</text><text x="905" y="407" fill="#61dfbc" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Projected result: $164.00</text><text x="889" y="465" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Click, type, expand, or switch tabs.</text><text x="889" y="496" fill="#aebbd6" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Return to Edit to revise.</text><rect x="40" y="582" width="1200" height="108" rx="12" fill="#171d34" stroke="none" stroke-width="1"/><text x="62" y="619" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Then keep what you made.</text><text x="62" y="655" fill="#aebbd6" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">Use local save and save points while editing; export Project for backup or another device.</text>
</svg>
