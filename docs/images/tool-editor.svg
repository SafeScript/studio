<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="778" viewBox="0 0 1280 778" role="img" aria-labelledby="title desc">
<title id="title">Tool editor scope and returning to a page</title>
<desc id="desc">A realistic simplified tool-editing state shows Home then Story Card in the breadcrumb. The canvas contains the tool’s image, title, summary and action blocks. Tool-level Properties offers Name, Add section and Back to page; deeper nesting uses Back to parent. Returning renders the edited definition in its instances.</desc>
<rect x="0" y="0" width="1280" height="778" rx="20" fill="#0d1222" stroke="none" stroke-width="1"/>
<text x="40" y="45" fill="#61dfbc" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">SAFE STUDIO / UX GUIDE</text><text x="40" y="91" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">Edit a reusable tool without losing the page</text><text x="40" y="123" fill="#aebbd6" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">The canvas becomes the tool’s internal composition; breadcrumbs keep the editing scope visible.</text><rect x="40" y="160" width="1200" height="46" rx="8" fill="#222b49" stroke="none" stroke-width="1"/><rect x="52" y="169" width="28" height="28" rx="6" fill="#8975ff" stroke="none" stroke-width="1"/><text x="61" y="189" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">S</text><text x="92" y="189" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Safe Studio</text><rect x="229" y="168" width="95" height="32" rx="6" fill="#222b49" stroke="none" stroke-width="1"/><text x="239" y="190" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Home</text><rect x="340" y="168" width="73" height="32" rx="6" fill="#8975ff" stroke="none" stroke-width="1"/><text x="350" y="190" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Desktop</text><rect x="417" y="168" width="64" height="32" rx="6" fill="#222b49" stroke="none" stroke-width="1"/><text x="427" y="190" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400">Tablet</text><rect x="494" y="168" width="65" height="32" rx="6" fill="#222b49" stroke="none" stroke-width="1"/><text x="504" y="190" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400">Mobile</text><rect x="581" y="168" width="58" height="32" rx="6" fill="#8975ff" stroke="none" stroke-width="1"/><text x="591" y="190" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Edit</text><rect x="646" y="168" width="58" height="32" rx="6" fill="#222b49" stroke="none" stroke-width="1"/><text x="656" y="190" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">Test</text><text x="718" y="189" fill="#aebbd6" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">Saved</text><rect x="777" y="168" width="102" height="32" rx="6" fill="#222b49" stroke="none" stroke-width="1"/><text x="787" y="190" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">Save point</text><rect x="888" y="168" width="77" height="32" rx="6" fill="#222b49" stroke="none" stroke-width="1"/><text x="898" y="190" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">Import</text><rect x="974" y="168" width="80" height="32" rx="6" fill="#222b49" stroke="none" stroke-width="1"/><text x="984" y="190" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">Project</text><rect x="1063" y="168" width="65" height="32" rx="6" fill="#222b49" stroke="none" stroke-width="1"/><text x="1073" y="190" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">JSON</text><rect x="1137" y="168" width="65" height="32" rx="6" fill="#8975ff" stroke="none" stroke-width="1"/><text x="1147" y="190" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">HTML</text><rect x="40" y="224" width="1200" height="50" rx="6" fill="#222b49" stroke="none" stroke-width="1"/><text x="58" y="256" fill="#8975ff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Home  ›  Story Card</text><text x="745" y="256" fill="#61dfbc" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Editing a tool definition</text><rect x="40" y="292" width="794" height="322" rx="10" fill="#171d34" stroke="#354161" stroke-width="1"/><text x="63" y="322" fill="#aebbd6" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">STORY CARD / INTERNAL CANVAS</text><rect x="64" y="343" width="746" height="236" rx="8" fill="#222b49" stroke="none" stroke-width="1"/><rect x="88" y="368" width="247" height="184" rx="8" fill="#375465" stroke="none" stroke-width="1"/><text x="108" y="461" fill="#aebbd6" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">Image block</text><rect x="358" y="370" width="423" height="63" rx="5" fill="#332b56" stroke="#8975ff" stroke-width="2"/><text x="374" y="409" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">A reusable story title</text><text x="358" y="473" fill="#aebbd6" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">Summary text and an action block</text><rect x="360" y="501" width="144" height="32" rx="6" fill="#8975ff" stroke="none" stroke-width="1"/><text x="370" y="523" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Read story</text><rect x="854" y="292" width="386" height="322" rx="10" fill="#171d34" stroke="#354161" stroke-width="1"/><text x="875" y="324" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Properties</text><text x="875" y="361" fill="#aebbd6" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Name</text><rect x="875" y="370" width="343" height="35" rx="5" fill="#222b49" stroke="#354161" stroke-width="1"/><text x="885" y="394" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Story Card</text><rect x="875" y="434" width="343" height="32" rx="6" fill="#8975ff" stroke="none" stroke-width="1"/><text x="885" y="456" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">+ Add section</text><rect x="875" y="485" width="343" height="32" rx="6" fill="#222b49" stroke="none" stroke-width="1"/><text x="885" y="507" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">← Back to page</text><text x="875" y="567" fill="#aebbd6" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Back to parent for deeper nesting.</text><rect x="40" y="641" width="1200" height="106" rx="10" fill="#171d34" stroke="none" stroke-width="1"/><text x="60" y="678" fill="#61dfbc" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">When you return, the definition renders in its page instances.</text><text x="60" y="713" fill="#aebbd6" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">The page’s own sections are kept while you work inside the tool; each instance has its own handler context.</text>
</svg>
