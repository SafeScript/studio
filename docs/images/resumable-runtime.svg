<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="736" viewBox="0 0 1200 736" role="img" aria-labelledby="title desc">
<title id="title">SafeScript resumable debugging architecture</title>
<desc id="desc">Handler source is validated and compiled into native continuation instructions that execute with explicit resumable frames. A checkpoint graph captures state, source versions, and journal positions. It supports the execution explorer and sandbox DOM projection. Commit applies selected pending effects; arbitrary host calls cannot be suspended internally.</desc>
<rect x="0" y="0" width="1200" height="736" rx="20" fill="#101c30" stroke="none"/>
<text x="40" y="54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#52e0bc">INSIDE THE DEBUGGER</text><text x="40" y="98" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#f4f7fc">Explicit state makes execution resumable.</text><text x="40" y="130" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#a6b8d2">The debug path compiles SafeScript into continuation instructions.</text><rect x="40" y="168" width="330" height="112" rx="12" fill="#19283f" stroke="none"/><text x="60" y="207" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#f4f7fc">Handler source</text><text x="60" y="246" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#a6b8d2">SafeScript + source locations</text><rect x="435" y="168" width="330" height="112" rx="12" fill="#19283f" stroke="none"/><text x="455" y="207" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#f4f7fc">Validate and compile</text><text x="455" y="246" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#a6b8d2">Native continuation instructions</text><rect x="830" y="168" width="330" height="112" rx="12" fill="#19283f" stroke="none"/><text x="850" y="207" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#f4f7fc">Resumable frames</text><text x="850" y="246" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#a6b8d2">PC · bindings · operands · calls</text><path d="M370 223 L427 223" fill="none" stroke="#52e0bc" stroke-width="3"/><path d="M415 215 L427 223" fill="none" stroke="#52e0bc" stroke-width="3"/><path d="M415 231 L427 223" fill="none" stroke="#52e0bc" stroke-width="3"/><path d="M765 223 L822 223" fill="none" stroke="#52e0bc" stroke-width="3"/><path d="M810 215 L822 223" fill="none" stroke="#52e0bc" stroke-width="3"/><path d="M810 231 L822 223" fill="none" stroke="#52e0bc" stroke-width="3"/><path d="M994 280 L994 324" fill="none" stroke="#52e0bc" stroke-width="3"/><path d="M994 324 L600 324" fill="none" stroke="#52e0bc" stroke-width="3"/><path d="M600 324 L600 354" fill="none" stroke="#52e0bc" stroke-width="3"/><rect x="250" y="354" width="700" height="112" rx="12" fill="#1c3d43" stroke="#52e0bc"/><text x="274" y="390" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#52e0bc">CHECKPOINT GRAPH</text><text x="274" y="424" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#f4f7fc">State snapshots + source versions + journal positions</text><text x="274" y="451" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#a6b8d2">Seek · inspect · edit · continue into independent futures</text><path d="M430 466 L430 507" fill="none" stroke="#52e0bc" stroke-width="3"/><path d="M770 466 L770 507" fill="none" stroke="#52e0bc" stroke-width="3"/><rect x="40" y="507" width="530" height="107" rx="12" fill="#19283f" stroke="none"/><text x="62" y="541" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#f4f7fc">Execution explorer</text><text x="62" y="573" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#a6b8d2">Event rows · sub-steps · scrubber · fork map</text><text x="62" y="598" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#52e0bc">Inspect or resume a selected checkpoint</text><rect x="630" y="507" width="530" height="107" rx="12" fill="#19283f" stroke="none"/><text x="652" y="541" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#f4f7fc">Sandbox DOM + pending journal</text><text x="652" y="573" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#a6b8d2">Project the result while the live page waits</text><text x="652" y="598" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#52e0bc">Commit applies the selected pending effects</text><text x="40" y="664" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#ffcd7c">Suspension happens at generated checkpoints, not inside arbitrary host calls.</text><text x="40" y="700" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#a6b8d2">Normal run uses the existing compiler/runtime. This diagram shows the debug path.</text>
</svg>
