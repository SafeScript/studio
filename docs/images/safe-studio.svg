<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">Safe Studio: design, behavior, and portable projects</title>
<desc id="desc">An illustrated overview of three workflows: build a page visually from layouts and tools; add code and explore alternate execution futures; edit on mobile and exchange JSON projects with people or bots. The editor needs no server to start.</desc>
<rect x="0" y="0" width="1200" height="610" rx="22" fill="#101b30" stroke="none"/>
<text x="40" y="48" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#56dfbd">SAFE STUDIO</text><text x="40" y="96" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#eff4ff">A canvas. Some code. A world of possibilities.</text><text x="40" y="129" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#abbad3">The visual programming spirit of Visual Basic and HyperCard, brought to the Web.</text><rect x="40" y="164" width="352" height="360" rx="16" fill="#1a2943" stroke="none"/><text x="62" y="198" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#56dfbd">01</text><text x="62" y="233" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#eff4ff">Build visually</text><text x="62" y="264" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#abbad3">Pages, layouts, reusable tools</text><rect x="424" y="164" width="352" height="360" rx="16" fill="#1a2943" stroke="none"/><text x="446" y="198" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#56dfbd">02</text><text x="446" y="233" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#eff4ff">Make it behave</text><text x="446" y="264" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#abbad3">Familiar code, explorable results</text><rect x="808" y="164" width="352" height="360" rx="16" fill="#1a2943" stroke="none"/><text x="830" y="198" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#56dfbd">03</text><text x="830" y="233" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#eff4ff">Take it with you</text><text x="830" y="264" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#abbad3">Mobile editing, portable JSON</text><rect x="62" y="287" width="308" height="168" rx="10" fill="#0c1526" stroke="#415575"/><rect x="72" y="298" width="288" height="18" rx="4" fill="#304260" stroke="none"/><rect x="74" y="330" width="284" height="54" rx="6" fill="#3c3670" stroke="none"/><text x="86" y="353" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#eff4ff">Your next big idea</text><text x="86" y="374" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#abbad3">Start here. Make it yours.</text><rect x="74" y="395" width="88" height="43" rx="6" fill="#284859" stroke="none"/><rect x="172" y="395" width="88" height="43" rx="6" fill="#284859" stroke="none"/><rect x="270" y="395" width="88" height="43" rx="6" fill="#284859" stroke="none"/><path d="M216 455 L216 468 M171 468 L261 468" fill="none" stroke="#abbad3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="62" y="499" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#56dfbd">Arrange → customize → reuse</text><rect x="446" y="287" width="308" height="92" rx="9" fill="#0c1526" stroke="none"/><text x="462" y="314" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#b9a0ff">onClick</text><text x="462" y="341" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#eff4ff">total = seats * price;</text><text x="462" y="366" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#abbad3">Inspect values. Try an edit.</text><path d="M462 423 L568 423 C615 423 604 401 645 401 L728 401" fill="none" stroke="#8fbcff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M568 423 C615 423 604 453 645 453 L728 453" fill="none" stroke="#56dfbd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="462" cy="423" r="6" fill="#101b30" stroke="#56dfbd" stroke-width="3"/><circle cx="568" cy="423" r="6" fill="#101b30" stroke="#56dfbd" stroke-width="3"/><circle cx="728" cy="401" r="6" fill="#101b30" stroke="#8fbcff" stroke-width="3"/><circle cx="728" cy="453" r="6" fill="#101b30" stroke="#56dfbd" stroke-width="3"/><text x="447" y="499" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#56dfbd">Pause → rewind → explore</text><rect x="832" y="287" width="108" height="183" rx="15" fill="#0c1526" stroke="#52698c"/><rect x="842" y="310" width="88" height="56" rx="5" fill="#3c3670" stroke="none"/><text x="851" y="335" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#eff4ff">Hello, Web</text><rect x="842" y="377" width="88" height="54" rx="5" fill="#284859" stroke="none"/><rect x="842" y="443" width="88" height="14" rx="4" fill="#304260" stroke="none"/><rect x="960" y="300" width="175" height="146" rx="10" fill="#0c1526" stroke="#52698c"/><text x="977" y="330" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#b9a0ff">project.json</text><text x="977" y="363" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#eff4ff">{ pages,</text><text x="989" y="390" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#eff4ff">tools,</text><text x="989" y="417" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#eff4ff">handlers }</text><text x="832" y="499" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#56dfbd">People ↔ JSON ↔ bots</text><text x="40" y="572" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#eff4ff">No server to start</text><text x="424" y="572" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#eff4ff">Yours to inspect and change</text><text x="808" y="572" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#eff4ff">Built for desktop and mobile</text>
</svg>
