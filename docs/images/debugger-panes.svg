<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="787" viewBox="0 0 1280 787" role="img" aria-labelledby="title desc">
<title id="title">Canvas projection, code pane and timeline explorer working together</title>
<desc id="desc">A quote calculator projection sits above side-by-side Handlers and Timeline panes. The handler shows an edited calculation. The explorer shows original and edited futures, a scrubber, event sub-steps and Continue, Fork here, Commit and Discard controls. Layout and content are simplified for explanation.</desc>
<rect x="0" y="0" width="1280" height="787" rx="20" fill="#0d1222" stroke="none" stroke-width="1"/>
<text x="40" y="45" fill="#61dfbc" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">SAFE STUDIO / UX GUIDE</text><text x="40" y="91" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">Keep the result in view while you explore its cause</text><text x="40" y="123" fill="#aebbd6" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Handlers shows code and values. Timeline shows recorded checkpoints and alternate futures.</text><rect x="40" y="159" width="1200" height="156" rx="12" fill="#171d34" stroke="#354161" stroke-width="1"/><text x="62" y="193" fill="#aebbd6" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">PAGE CANVAS / SELECTED SESSION PROJECTION</text><text x="62" y="241" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">Team quote</text><rect x="291" y="211" width="212" height="32" rx="6" fill="#8975ff" stroke="none" stroke-width="1"/><text x="301" y="233" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Calculate team quote</text><rect x="785" y="204" width="425" height="72" rx="8" fill="#183a37" stroke="none" stroke-width="1"/><text x="807" y="232" fill="#aebbd6" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Projected quote</text><text x="807" y="263" fill="#61dfbc" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">$137.90</text><text x="62" y="292" fill="#aebbd6" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Live page stays at its previous value until commit.</text><rect x="40" y="335" width="501" height="343" rx="12" fill="#171d34" stroke="#354161" stroke-width="1"/><text x="62" y="371" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">Handlers</text><rect x="62" y="389" width="222" height="32" rx="6" fill="#222b49" stroke="none" stroke-width="1"/><text x="72" y="411" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Quote_Action ▾</text><rect x="295" y="389" width="125" height="32" rx="6" fill="#222b49" stroke="none" stroke-width="1"/><text x="305" y="411" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">onClick ▾</text><rect x="58" y="444" width="465" height="81" rx="6" fill="#332e48" stroke="none" stroke-width="1"/><text x="71" y="475" fill="#eef2ff" font-family="Consolas, monospace" font-size="22" font-weight="400">const total =</text><text x="71" y="508" fill="#61dfbc" font-family="Consolas, monospace" font-size="20" font-weight="400">subtotal * 0.85 - discount;</text><rect x="62" y="545" width="146" height="32" rx="6" fill="#222b49" stroke="none" stroke-width="1"/><text x="72" y="567" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Apply edits</text><rect x="221" y="545" width="132" height="32" rx="6" fill="#222b49" stroke="none" stroke-width="1"/><text x="231" y="567" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Continue</text><text x="62" y="623" fill="#aebbd6" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Inspect values and source version</text><rect x="559" y="335" width="681" height="343" rx="12" fill="#171d34" stroke="#354161" stroke-width="1"/><text x="579" y="371" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Timeline / Execution explorer</text><rect x="579" y="391" width="208" height="32" rx="6" fill="#222b49" stroke="none" stroke-width="1"/><text x="589" y="413" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Continue from here</text><rect x="799" y="391" width="113" height="32" rx="6" fill="#222b49" stroke="none" stroke-width="1"/><text x="809" y="413" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Fork here</text><rect x="923" y="391" width="99" height="32" rx="6" fill="#222b49" stroke="none" stroke-width="1"/><text x="933" y="413" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Commit</text><rect x="1034" y="391" width="99" height="32" rx="6" fill="#222b49" stroke="none" stroke-width="1"/><text x="1044" y="413" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Discard</text><path d="M590 482 L805 482 C852 482 849 455 905 455 L1185 455" stroke="#93bcff" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M805 482 C852 482 849 509 905 509 L1185 509" stroke="#61dfbc" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="590" cy="482" r="6" fill="#0d1222" stroke="#61dfbc" stroke-width="3"/><circle cx="686" cy="482" r="6" fill="#0d1222" stroke="#61dfbc" stroke-width="3"/><circle cx="805" cy="482" r="6" fill="#0d1222" stroke="#61dfbc" stroke-width="3"/><circle cx="1185" cy="455" r="6" fill="#0d1222" stroke="#93bcff" stroke-width="3"/><circle cx="1185" cy="509" r="6" fill="#0d1222" stroke="#61dfbc" stroke-width="3"/><text x="935" y="449" fill="#93bcff" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Original: $164.00</text><text x="935" y="538" fill="#61dfbc" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Edited: $137.90</text><path d="M589 567 L1208 567" stroke="#58688e" stroke-width="5" fill="none"/><circle cx="805" cy="567" r="10" fill="#0d1222" stroke="#61dfbc" stroke-width="3"/><text x="581" y="610" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">▾ Calculate team quote  →  sub-steps</text><text x="603" y="646" fill="#aebbd6" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Before total · recorded source + locals</text><text x="40" y="721" fill="#61dfbc" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Scrub to a checkpoint → inspect → apply a supported edit → continue into a retained new future.</text><text x="40" y="754" fill="#aebbd6" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Commit applies the chosen pending effects. Discard drops that session’s pending effects.</text>
</svg>
