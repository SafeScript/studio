<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="770" viewBox="0 0 1280 770" role="img" aria-labelledby="title desc">
<title id="title">Edit-mode tool previews and Qbix-connected Test mode</title>
<desc id="desc">Two simplified UI views show a chat tool as an editor preview and as a conceptual live conversation. Actual live content requires a configured, authenticated Qbix application. Test mounts tool instances; returning to Edit restores previews. This image is an explanation, not a live backend verification.</desc>
<rect x="0" y="0" width="1280" height="770" rx="20" fill="#0d1222" stroke="none" stroke-width="1"/>
<text x="40" y="45" fill="#61dfbc" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">SAFE STUDIO / UX GUIDE</text><text x="40" y="91" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">The same tool block has two useful working modes</text><text x="40" y="123" fill="#aebbd6" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Illustrated host-dependent behavior · live service content below is a conceptual example</text><rect x="40" y="165" width="575" height="389" rx="12" fill="#171d34" stroke="#354161" stroke-width="1"/><text x="62" y="203" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Design the interface</text><rect x="62" y="222" width="63" height="32" rx="6" fill="#8975ff" stroke="none" stroke-width="1"/><text x="72" y="244" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Edit</text><rect x="137" y="222" width="63" height="32" rx="6" fill="#222b49" stroke="none" stroke-width="1"/><text x="147" y="244" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Test</text><rect x="62" y="273" width="531" height="201" rx="8" fill="#222b49" stroke="none" stroke-width="1"/><text x="80" y="304" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Community conversation</text><rect x="80" y="321" width="322" height="37" rx="10" fill="#33425e" stroke="none" stroke-width="1"/><rect x="147" y="370" width="406" height="37" rx="10" fill="#3c345b" stroke="none" stroke-width="1"/><text x="80" y="449" fill="#aebbd6" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Tool preview / configured options</text><text x="62" y="511" fill="#93bcff" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Block tool: Streams/chat</text><rect x="665" y="165" width="575" height="389" rx="12" fill="#171d34" stroke="#354161" stroke-width="1"/><text x="687" y="203" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Try the connected tool</text><rect x="687" y="222" width="63" height="32" rx="6" fill="#222b49" stroke="none" stroke-width="1"/><text x="697" y="244" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Edit</text><rect x="762" y="222" width="63" height="32" rx="6" fill="#8975ff" stroke="none" stroke-width="1"/><text x="772" y="244" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Test</text><rect x="687" y="273" width="531" height="201" rx="8" fill="#222b49" stroke="none" stroke-width="1"/><text x="705" y="304" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Community conversation</text><rect x="705" y="321" width="434" height="42" rx="8" fill="#273f4c" stroke="none" stroke-width="1"/><text x="718" y="348" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Jamie: Shall we meet on Friday?</text><rect x="705" y="378" width="476" height="45" rx="6" fill="#0d1222" stroke="none" stroke-width="1"/><text x="719" y="407" fill="#aebbd6" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Write a message…</text><text x="705" y="449" fill="#61dfbc" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Current host session + tool services</text><text x="687" y="511" fill="#93bcff" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Block tool: Streams/chat</text><rect x="40" y="584" width="1200" height="152" rx="12" fill="#171d34" stroke="none" stroke-width="1"/><text x="62" y="622" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Qbix supplies the application context.</text><text x="62" y="660" fill="#aebbd6" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">In a bootstrapped Qbix page, Test mounts supported tools with their saved options.</text><text x="62" y="697" fill="#61dfbc" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400">Returning to Edit restores previews. Without a connected host, backend tools remain previews.</text>
</svg>
