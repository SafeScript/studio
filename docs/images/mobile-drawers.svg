<title id="title">Mobile drawers, inspector tabs and bottom navigation</title>
<desc id="desc">Two annotated phone views show a selected heading with the Properties sheet open and the Add to page sheet open. A legend explains Properties, Add, Handlers, Timeline and Console. The More menu contains project and export actions. Illustrations use real pane names, with simplified content.</desc>
