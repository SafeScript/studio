<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Safe Studio project and component model</title>
<desc id="desc">A project holds pages and shared custom tool definitions. A page contains sections; each section uses a layout to arrange blocks. Each block renders content or a tool instance. Custom tools are reusable compositions that can contain their own sections, blocks, and handlers.</desc>
<rect x="0" y="0" width="1200" height="720" rx="22" fill="#101b30" stroke="none"/>
<text x="40" y="50" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#56dfbd">HOW THE PIECES FIT</text><text x="40" y="96" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#eff4ff">Small pieces compose into whole websites.</text><path d="M448 224 L448 256" fill="none" stroke="#56dfbd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M448 350 L448 382" fill="none" stroke="#56dfbd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M448 476 L448 508" fill="none" stroke="#56dfbd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M782 429 L704 429" fill="none" stroke="#b9a0ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M782 555 L704 555" fill="none" stroke="#8fbcff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="190" y="130" width="514" height="94" rx="16" fill="#1a2943" stroke="none"/><text x="214" y="164" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#eff4ff">Project</text><text x="214" y="195" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#abbad3">Pages + shared custom tool definitions</text><rect x="190" y="256" width="514" height="94" rx="16" fill="#1a2943" stroke="none"/><text x="214" y="290" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#eff4ff">Page</text><text x="214" y="321" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#abbad3">Sections + handlers + styles + metadata</text><rect x="190" y="382" width="514" height="94" rx="16" fill="#1a2943" stroke="none"/><text x="214" y="416" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#eff4ff">Section</text><text x="214" y="447" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#abbad3">A layout arranges its blocks</text><rect x="190" y="508" width="514" height="94" rx="16" fill="#1a2943" stroke="none"/><text x="214" y="542" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#eff4ff">Block</text><text x="214" y="573" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#abbad3">Content or an instance of a tool</text><rect x="782" y="130" width="378" height="94" rx="16" fill="#1a2943" stroke="none"/><text x="806" y="164" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#b9a0ff">Custom tool definitions</text><text x="806" y="195" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#abbad3">Reusable sections, blocks, handlers</text><path d="M704 177 L782 177" fill="none" stroke="#b9a0ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="782" y="256" width="378" height="94" rx="16" fill="#1a2943" stroke="none"/><text x="806" y="290" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#eff4ff">Nested composition</text><text x="806" y="321" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#abbad3">Tools can contain their own sections</text><path d="M972 224 L972 256" fill="none" stroke="#b9a0ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="782" y="382" width="378" height="94" rx="16" fill="#30284b" stroke="none"/><text x="806" y="416" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#b9a0ff">Layout</text><text x="806" y="447" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#abbad3">Grid + starting block roles</text><rect x="782" y="508" width="378" height="94" rx="16" fill="#1a3549" stroke="none"/><text x="806" y="542" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#8fbcff">Tool</text><text x="806" y="573" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#abbad3">Type or reusable component</text><text x="40" y="653" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#eff4ff">Example: Business site → Home → Hero section → Heading, text, and action blocks</text><text x="40" y="688" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#abbad3">The same structure is editable on the canvas or described in a JSON project.</text>
</svg>
