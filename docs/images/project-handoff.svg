<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="808" viewBox="0 0 1280 808" role="img" aria-labelledby="title desc">
<title id="title">Desktop and mobile export, JSON handoff and import review</title>
<desc id="desc">An annotated desktop header shows Save point, Share preview, Import, Project, JSON and HTML. Three cards explain exporting an editable project, changing or transferring the JSON, and reviewing import warnings. Mobile uses More for these actions; local save and shared snapshots are distinguished.</desc>
<rect x="0" y="0" width="1280" height="808" rx="20" fill="#0d1222" stroke="none" stroke-width="1"/>
<text x="40" y="45" fill="#61dfbc" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">SAFE STUDIO / UX GUIDE</text><text x="40" y="91" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">Move the project, not just a picture of the page</text><text x="40" y="123" fill="#aebbd6" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">The desktop header and mobile More menu expose the same save, import, and export tasks.</text><rect x="40" y="164" width="1200" height="76" rx="12" fill="#171d34" stroke="none" stroke-width="1"/><text x="61" y="193" fill="#aebbd6" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">DESKTOP HEADER</text><rect x="61" y="200" width="113" height="32" rx="6" fill="#222b49" stroke="none" stroke-width="1"/><text x="71" y="222" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Save point</text><rect x="185" y="200" width="150" height="32" rx="6" fill="#222b49" stroke="none" stroke-width="1"/><text x="195" y="222" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Share preview</text><rect x="346" y="200" width="105" height="32" rx="6" fill="#222b49" stroke="none" stroke-width="1"/><text x="356" y="222" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Import</text><rect x="462" y="200" width="113" height="32" rx="6" fill="#8975ff" stroke="none" stroke-width="1"/><text x="472" y="222" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Project</text><rect x="586" y="200" width="89" height="32" rx="6" fill="#222b49" stroke="none" stroke-width="1"/><text x="596" y="222" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">JSON</text><rect x="686" y="200" width="89" height="32" rx="6" fill="#222b49" stroke="none" stroke-width="1"/><text x="696" y="222" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">HTML</text><text x="822" y="214" fill="#61dfbc" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Project → editable website file</text><rect x="40" y="274" width="372" height="341" rx="12" fill="#171d34" stroke="#354161" stroke-width="1"/><text x="60" y="314" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">1  Export</text><rect x="454" y="274" width="372" height="341" rx="12" fill="#171d34" stroke="#354161" stroke-width="1"/><text x="474" y="314" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">2  Edit or transfer</text><rect x="868" y="274" width="372" height="341" rx="12" fill="#171d34" stroke="#354161" stroke-width="1"/><text x="888" y="314" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">3  Import and review</text><text x="62" y="360" fill="#61dfbc" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Project</text><text x="62" y="390" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400">All pages + reusable tools</text><text x="62" y="429" fill="#93bcff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">JSON</text><text x="62" y="459" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400">Current page</text><text x="62" y="498" fill="#93bcff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">HTML</text><text x="62" y="528" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400">Runnable page output</text><text x="62" y="583" fill="#aebbd6" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Choose the artifact you need.</text><rect x="476" y="343" width="328" height="99" rx="8" fill="#0d1222" stroke="none" stroke-width="1"/><text x="492" y="373" fill="#61dfbc" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">my-project.safestudio</text><text x="492" y="412" fill="#aebbd6" font-family="Consolas, monospace" font-size="18" font-weight="400">{ pages: […], tools: […] }</text><text x="476" y="487" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400">Give JSON + LLM.md to a bot,</text><text x="476" y="520" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400">or move it to another device.</text><text x="476" y="583" fill="#aebbd6" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Keep a backup before changes.</text><rect x="887" y="342" width="334" height="208" rx="8" fill="#222b49" stroke="none" stroke-width="1"/><text x="902" y="373" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Review import</text><text x="902" y="409" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Checked project structure</text><text x="902" y="439" fill="#aebbd6" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Review repairs / warnings</text><rect x="902" y="469" width="138" height="32" rx="6" fill="#222b49" stroke="none" stroke-width="1"/><text x="912" y="491" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Cancel</text><rect x="1051" y="469" width="151" height="32" rx="6" fill="#8975ff" stroke="none" stroke-width="1"/><text x="1061" y="491" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Import project</text><text x="887" y="583" fill="#aebbd6" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Then inspect the page in Test.</text><rect x="40" y="647" width="1200" height="128" rx="12" fill="#171d34" stroke="none" stroke-width="1"/><text x="62" y="684" fill="#eef2ff" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">ON MOBILE: More → Project / JSON / HTML or Import</text><text x="62" y="722" fill="#aebbd6" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400">Local save stays in this browser. Project export is portable; Share Preview is an isolated snapshot.</text><text x="62" y="755" fill="#61dfbc" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">A preview link requires a hosted editor and does not synchronize changes back to the original.</text>
</svg>
