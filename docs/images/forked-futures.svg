<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Exploring an event and branching its future</title>
<desc id="desc">A click expands into entry, inputs-ready, and before-total checkpoints. From the before-total checkpoint, two futures are retained: the original calculation at 164 dollars and the edited calculation at 137.90 dollars. Seeking and continuing preserves the old future.</desc>
<rect x="0" y="0" width="1200" height="760" rx="20" fill="#101c30" stroke="none"/>
<text x="40" y="54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#52e0bc">ONE EVENT, MORE THAN ONE FUTURE</text><text x="40" y="98" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#f4f7fc">Keep the original. Try another outcome.</text><text x="40" y="131" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#a6b8d2">Conceptual sequence for the included quote calculator</text><rect x="40" y="162" width="1120" height="87" rx="12" fill="#19283f" stroke="none"/><text x="64" y="194" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#a6b8d2">EVENT</text><text x="64" y="225" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#f4f7fc">Click Calculate team quote</text><text x="720" y="197" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#a6b8d2">Expand to inspect its sub-steps.</text><text x="720" y="226" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#a6b8d2">Scrub to a recorded checkpoint.</text><path d="M106 351 L495 351" fill="none" stroke="#52e0bc" stroke-width="4"/><path d="M495 351 C580 351 565 291 650 291 L718 291" fill="none" stroke="#86b5ff" stroke-width="4"/><path d="M495 351 C580 351 565 445 650 445 L718 445" fill="none" stroke="#52e0bc" stroke-width="4"/><circle cx="106" cy="351" r="10" fill="#101c30" stroke="#52e0bc" stroke-width="3"/><circle cx="290" cy="351" r="10" fill="#101c30" stroke="#52e0bc" stroke-width="3"/><circle cx="495" cy="351" r="10" fill="#101c30" stroke="#52e0bc" stroke-width="3"/><text x="67" y="310" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#f4f7fc">Event entry</text><text x="244" y="310" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#f4f7fc">Inputs ready</text><text x="415" y="310" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#ffcd7c">Before total</text><text x="70" y="390" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#a6b8d2">Captured</text><text x="251" y="390" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#a6b8d2">Locals</text><text x="426" y="390" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#ffcd7c">Seek here</text><rect x="720" y="260" width="414" height="109" rx="12" fill="#19283f" stroke="#86b5ff"/><text x="744" y="290" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#86b5ff">ORIGINAL FUTURE</text><text x="744" y="323" font-family="Consolas, monospace" font-size="18" font-weight="400" fill="#f4f7fc">subtotal - discount</text><text x="744" y="351" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#86b5ff">Result: $164.00</text><rect x="720" y="414" width="414" height="109" rx="12" fill="#19283f" stroke="#52e0bc"/><text x="744" y="444" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#52e0bc">EDITED FUTURE</text><text x="744" y="477" font-family="Consolas, monospace" font-size="18" font-weight="400" fill="#f4f7fc">subtotal * 0.85 - discount</text><text x="744" y="505" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#52e0bc">Result: $137.90</text><rect x="40" y="550" width="1120" height="155" rx="12" fill="#19283f" stroke="none"/><text x="65" y="584" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#52e0bc">REWIND → EDIT → APPLY EDITS → CONTINUE</text><text x="65" y="619" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#f4f7fc">Resuming from the past adds a path. The previous future stays selectable.</text><text x="65" y="650" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#a6b8d2">Each recorded position retains its source version and resumable state.</text><text x="65" y="680" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#a6b8d2">Compare the projected results, then commit the chosen pending effects.</text>
</svg>
